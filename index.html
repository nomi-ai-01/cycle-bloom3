v.innerHTML=`<small>${t("hello")}</small><h1>${t("today")}</h1>${al?`<div class="alert">${al}</div>`:""}<div class="card hero"><div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(d||0,len)/len)}"/></svg><div><b>${t("day")}</b><strong>${s?d:"—"}</strong></div></div><div><small>${t("nextp")}</small><h2>${nm}</h2><p class="mut">${nd}</p><p class="mut"><b>${s?t(phk()):""}</b></p></div></div>
<button class="p" onclick="startP()">${t("st")}</button><button onclick="endP()">${t("en")}</button><button onclick="icsOut()">${t("rem")}</button>
<h2 style="margin-top:22px">${t("glance")}</h2><div class="row"><div class="card stat"><span class="mut">${t("avg")}</span><strong>${len} <small>${t("days")}</small></strong></div><div class="card stat"><span class="mut">${t("pl")}</span><strong>${S.per} <small>${t("days")}</small></strong></div></div><p class="mut">${t("est")}</p>`}
function cal(v){const f=new Date(cur.getFullYear(),cur.getMonth(),1,12),mo=iso(f).slice(0,7),st=add(iso(f),-f.getDay()),pd=new Set,pr=new Set,ov=new Set;
starts().forEach(s=>{for(let i=0;i<S.per;i++)pd.add(add(s,i))});Object.keys(S.logs).forEach(d=>{if(S.logs[d].period)pd.add(d)});
let n=nextP(),g=0;while(n&&n.slice(0,7)<=mo&&g++<30){for(let i=0;i<S.per;i++)pr.add(add(n,i));const o=add(n,-14);for(let i=-3;i<=1;i++)ov.add(add(o,i));n=add(n,avg())}
const wd=S.lang==="ur"?["اتوار","پیر","منگل","بدھ","جمعرات","جمعہ","ہفتہ"]:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];let h=wd.map(x=>`<span>${x}</span>`).join("");
for(let i=0;i<42;i++){const d=add(st,i),c=[d.slice(0,7)!==mo?"o":"",d===today()?"t":"",d===sel?"s":"",pd.has(d)?"l":pr.has(d)?"pr":"",ov.has(d)?"ov":""].join(" ");h+=`<button class="${c}" onclick="sel='${d}';draw()">${+d.slice(8)}</button>`}
const x=S.logs[sel],dt=x?(x.period?t("pd"):t("ent")):pr.has(sel)?t("prd"):t("nod");
v.innerHTML=`<small>${t("hist")}</small><h1>${t("calt")}</h1><div class="card"><div class="top"><button class="round" onclick="cur=new Date(cur.getFullYear(),cur.getMonth()-1,1,12);draw()">‹</button><h2>${fmt(iso(f),{month:"long",year:"numeric"})}</h2><button class="round" onclick="cur=new Date(cur.getFullYear(),cur.getMonth()+1,1,12);draw()">›</button></div><div class="g">${h}</div><div class="lg"><span>${t("lg1")}</span><span>${t("lg2")}</span><span>${t("lg3")}</span></div></div><div class="card"><small>${t("sel")}</small><h2>${fmt(sel,{weekday:"long",month:"long",day:"numeric"})}</h2><p class="mut">${dt}</p><button class="p" onclick="go('log')">${t("logd")}</button></div>`}
function log(v){const x=S.logs[ld]||{},sy=x.sym||[];
v.innerHTML=`<small>${t("journal")}</small><h1>${t("logt")}</h1><p class="mut">${t("logs")}</p><div class="card"><label>${t("date")}</label><input id="ld" type="date" value="${ld}" max="${today()}" onchange="if(this.value){ld=this.value;sel=ld;draw()}"><label class="ck"><input type="checkbox" id="ip" ${x.period?"checked":""}>${t("isp")}</label><br><fieldset><legend>${t("flow")}</legend><div class="chips">${["light","medium","heavy"].map(k=>`<label class="chip"><input type="radio" name="fl" value="${k}" ${x.flow===k?"checked":""}>${t(k)}</label>`).join("")}</div></fieldset><fieldset><legend>${t("mood")}</legend><div class="chips">${["calm","good","low","anxious"].map(k=>`<label class="chip"><input type="radio" name="md" value="${k}" ${x.mood===k?"checked":""}>${t(k)}</label>`).join("")}</div></fieldset><fieldset><legend>${t("sym")}</legend><div class="chips">${SYM.map(k=>`<label class="chip"><input type="checkbox" name="sy" value="${k}" ${sy.includes(k)?"checked":""}>${S.lang==="ur"?SYU[k]:k}</label>`).join("")}</div></fieldset><label>${t("note")}</label><textarea id="nt" rows="4" maxlength="1200">${x.note||""}</textarea><button class="p" onclick="saveLog()">${t("save")}</button>${S.logs[ld]?`<button class="d" onclick="delLog()">${t("delE")}</button>`:""}</div>`}
function ins(v){const a=starts(),ns=lens(),sp=ns.length?Math.max(...ns)-Math.min(...ns):null;let ch="";
if(ns.length>=2){const d=ns.slice(-8),W=600,H=200,p=30,mn=Math.min(...d)-3,mx=Math.max(...d)+3,X=i=>p+i*(W-2*p)/(d.length-1),Y=y=>20+(mx-y)*(H-50)/(mx-mn);
ch=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">${[20,25,30,35,40,45].filter(y=>y>=mn&&y<=mx).map(y=>`<line x1="${p}" x2="${W-p}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--bd)"/><text x="4" y="${Y(y)+4}" fill="var(--mut)" font-size="12">${y}</text>`).join("")}<polyline fill="none" stroke="var(--rose)" stroke-width="3" stroke-linejoin="round" points="${d.map((y,i)=>X(i)+","+Y(y)).join(" ")}"/>${d.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="5" fill="var(--card)" stroke="var(--rose)" stroke-width="2.5"/>`).join("")}</svg>`}else ch=`<p class="mut">${t("ce")}</p>`;
v.innerHTML=`<small>${t("pat")}</small><h1>${t("inst")}</h1><div class="row"><div class="card stat"><span class="mut">${t("avg")}</span><strong>${avg()}</strong></div><div class="card stat"><span class="mut">${t("short")}</span><strong>${ns.length?Math.min(...ns):"—"}</strong></div></div><div class="row"><div class="card stat"><span class="mut">${t("long")}</span><strong>${ns.length?Math.max(...ns):"—"}</strong></div><div class="card stat"><span class="mut">${t("var")}</span><strong style="font-size:22px">${sp===null?"—":t(sp<=4?"vl":sp<=8?"vm":"vh")}</strong></div></div><div class="card"><h2>${t("chart")}</h2>${ch}</div>`}
function set(v){const o=(k,l)=>`<option value="${k}" ${S.theme===k?"selected":""}>${t(l)}</option>`;
v.innerHTML=`<small>${t("made")}</small><h1>${t("sett")}</h1><div class="card"><h2>${t("pref")}</h2><label>${t("lang")}</label><select id="sl"><option value="en" ${S.lang==="en"?"selected":""}>English</option><option value="ur" ${S.lang==="ur"?"selected":""}>اردو</option></select><label>${t("app")}</label><select id="sa">${o("auto","auto")}${o("light","lt")}${o("dark","dk")}</select><div class="row"><div><label>${t("cyc")}</label><input id="sc" type="number" min="15" max="60" value="${S.cyc}"></div><div><label>${t("pl")}</label><input id="sp" type="number" min="1" max="10" value="${S.per}"></div></div><h2>${t("rt")}</h2><label>${t("lead")}</label><input id="sd" type="number" min="1" max="10" value="${S.lead}"><label>${t("time")}</label><input id="stm" type="time" value="${S.time}"><label class="ck"><input type="checkbox" id="sn" ${S.notif?"checked":""}>${t("notif")}</label><button class="p" onclick="saveSet()">${t("saveS")}</button><button onclick="icsOut()">${t("rem")}</button></div>
<div class="card"><h2>${t("lock")}</h2><p class="mut">${t("pinH")}</p><label>${t("pin")}</label><input id="pn" type="password" inputmode="numeric" maxlength="4"><button onclick="savePin()">${t("save")}</button></div>
<div class="card"><h2>${t("bk")}</h2><button onclick="expB()">${t("exp")}</button><button onclick="$('#imp').click()">${t("imp")}</button><input id="imp" type="file" accept=".json" class="hidden" onchange="impB(this.files[0])"></div>
<div class="card"><h2>${t("inst2")}</h2>${ip?`<button class="p" onclick="ip.prompt()">${t("inst2")}</button>`:`<p class="mut">Chrome menu ⋮ → Add to Home screen / Install app.</p>`}</div>
<div class="card"><h2>${t("ab")}</h2><p class="mut">${t("abt")}</p></div><div class="card"><button class="d" onclick="wipe()">${t("del")}</button></div>`}
function startP(){ask(t("st").replace("＋ ",""),t("ps")).then(y=>{if(!y)return;S.logs[today()]={...(S.logs[today()]||{}),period:true};save();draw();toast(t("ps2"))})}
function endP(){const s=last();if(!s){toast(t("nops"));return}ask(t("en"),t("pe")).then(y=>{if(!y)return;S.per=cl(diff(s,today())+1,1,10);save();draw();toast(t("pe2"))})}
function saveLog(){const d=$("#ld").value;if(!d||d>today()){toast(t("fut"));return}const x={period:$("#ip").checked,flow:document.querySelector("[name=fl]:checked")?.value||"",mood:document.querySelector("[name=md]:checked")?.value||"",sym:[...document.querySelectorAll("[name=sy]:checked")].map(i=>i.value),note:$("#nt").value.trim()};
if(!x.period&&!x.flow&&!x.mood&&!x.sym.length&&!x.note)delete S.logs[d];else S.logs[d]=x;sel=d;save();toast(t("saved"));go("cal")}
function delLog(){ask(t("delE"),"?").then(y=>{if(y){delete S.logs[ld];save();go("cal")}})}
function saveSet(){S.lang=$("#sl").value;S.theme=$("#sa").value;S.cyc=cl(+$("#sc").value||28,15,60);S.per=cl(+$("#sp").value||5,1,10);S.lead=cl(+$("#sd").value||5,1,10);S.time=$("#stm").value||"09:00";const w=$("#sn").checked;
if(w&&"Notification"in window&&Notification.permission!=="granted"){Notification.requestPermission().then(p=>{S.notif=p==="granted";if(!S.notif)toast(t("nres"));save();draw()})}else{S.notif=w&&"Notification"in window;save();draw();toast(t("saved"))}}
async function savePin(){const p=$("#pn").value;if(p===""){S.pin="";save();toast(t("saved"));return}if(!/^\d{4}$/.test(p)){toast(t("pin2"));return}S.pin=await sha(p);save();$("#pn").value="";toast(t("saved"))}
function lockNow(){if(!S.pin)return;$("#lock").classList.remove("hidden");$("#app").classList.add("hidden");$("#nav").classList.add("hidden");$("#upin").value="";$("#uerr").textContent=""}
async function unlock(){if(await sha($("#upin").value)===S.pin){$("#lock").classList.add("hidden");$("#app").classList.remove("hidden");$("#nav").classList.remove("hidden");draw()}else $("#uerr").textContent=t("wrong")}
function forgot(){ask(t("fg"),t("sure")).then(y=>{if(y)wipe(1)})}
function wipe(f){const go=()=>{try{localStorage.removeItem("cb")}catch(e){}location.reload()};f?go():ask(t("del"),t("sure")).then(y=>{if(y)go()})}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
function expB(){dl(new Blob([JSON.stringify({cb:1,data:S},null,2)],{type:"application/json"}),"cycle-bloom-"+today()+".json");toast(t("saved"))}
async function impB(f){if(!f)return;if(!await ask(t("imp"),t("imp2")))return;try{const o=JSON.parse(await f.text());if(!o.cb||!o.data||!o.data.logs)throw 0;S={...D,...o.data};save();draw();toast(t("saved"))}catch(e){toast(t("bad"))}}
function icsOut(){const n=nextP();if(!n){toast(t("none"));return}const[h,m]=S.time.split(":").map(Number),p2=x=>String(x).padStart(2,"0"),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cycle Bloom//EN"];
for(let k=S.lead;k>=0;k--){const d=add(n,-k);if(d<today())continue;const s=d.replace(/-/g,"")+"T"+p2(h)+p2(m)+"00",e=d.replace(/-/g,"")+"T"+p2(h)+p2(Math.min(m+15,59))+"00",x=k===0?t("al0"):t("al1",{n:k});L.push("BEGIN:VEVENT","UID:cb-"+n+"-"+k+"@cb","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+s,"DTEND:"+e,"SUMMARY:Cycle Bloom","DESCRIPTION:"+x,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+x,"TRIGGER:PT0M","END:VALARM","END:VEVENT")}
L.push("END:VCALENDAR");dl(new Blob([L.join("\r\n")],{type:"text/calendar"}),"cycle-bloom-reminders.ics");toast(t("cal2"))}
function remind(){if(!S.notif||!("Notification"in window)||Notification.permission!=="granted")return;const n=nextP();if(!n)return;const k=diff(today(),n),w=new Date(),[h,m]=S.time.split(":").map(Number),key=today()+"|"+n;
if(k>S.lead||w.getHours()<h||(w.getHours()===h&&w.getMinutes()<m)||S.lastR===key)return;try{new Notification("Cycle Bloom",{body:k===0?t("al0"):t("al1",{n:k}),icon:"icon.svg"});S.lastR=key;save()}catch(e){}}
function ostep(d){if(d>0){if(os===1){S.lang=$("#ol").value}if(os===2){const l=$("#olast").value;if(!l||l>today()){toast(t("fut"));return}S.cyc=cl(+$("#oc").value||28,15,60);S.per=cl(+$("#op").value||5,1,10);S.first=l}
if(os===3){S.lead=cl(+$("#od").value||5,1,10);S.time=$("#otm").value||"09:00";S.logs[S.first]={period:true};delete S.first;S.ok=1;save();$("#onb").classList.add("hidden");$("#app").classList.remove("hidden");$("#nav").classList.remove("hidden");draw();if($("#on_").checked&&"Notification"in window)Notification.requestPermission().then(p=>{S.notif=p==="granted";save()});return}}
os=cl(os+d,1,3);orender()}
function orender(){ui();$("#dots").innerHTML=[1,2,3].map(i=>`<i class="${i<=os?"on":""}"></i>`).join("");$("#ob").classList.toggle("hidden",os===1);$("#ob").textContent=t("back");$("#on").textContent=os===3?t("begin"):t("cont");
const f=S.first||today();$("#os").innerHTML=os===1?`<small>CYCLE BLOOM</small><h1>${t("o1t")}</h1><p class="mut">${t("o1p")}</p><label>Language / زبان</label><select id="ol" onchange="S.lang=this.value;orender()"><option value="en" ${S.lang==="en"?"selected":""}>English</option><option value="ur" ${S.lang==="ur"?"selected":""}>اردو</option></select>`:os===2?`<h1>${t("o2t")}</h1><label>${t("o2d")}</label><input id="olast" type="date" max="${today()}" value="${f}"><div class="row"><div><label>${t("cyc")}</label><input id="oc" type="number" min="15" max="60" value="${S.cyc}"></div><div><label>${t("pl")}</label><input id="op" type="number" min="1" max="10" value="${S.per}"></div></div>`:`<h1>${t("o3t")}</h1><label>${t("lead")}</label><input id="od" type="number" min="1" max="10" value="${S.lead}"><label>${t("time")}</label><input id="otm" type="time" value="${S.time}"><label class="ck"><input type="checkbox" id="on_" checked>${t("notif")}</label>`}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e});
let hid=0;document.addEventListener("visibilitychange",()=>{if(document.hidden)hid=Date.now();else if(S.pin&&hid&&Date.now()-hid>1500&&S.ok)lockNow();else remind()});
ui();if(!S.ok){$("#onb").classList.remove("hidden");orender()}else if(S.pin){lockNow()}else{$("#app").classList.remove("hidden");$("#nav").classList.remove("hidden");draw();remind()}
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
